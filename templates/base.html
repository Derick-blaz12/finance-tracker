<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finance Tracker{% endblock %} - Finance Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('dashboard') }}">Finance Tracker</a>
      <nav class="nav">
        {% if g.user %}
        <a href="{{ url_for('dashboard') }}"
           {% if request.endpoint == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
        <a href="{{ url_for('transactions_page') }}"
           {% if request.endpoint in ('transactions_page', 'edit_transaction') %}class="active"{% endif %}>Transactions</a>
        <a href="{{ url_for('breakdown') }}"
           {% if request.endpoint == 'breakdown' %}class="active"{% endif %}>Breakdown</a>
        <a href="{{ url_for('account') }}"
           {% if request.endpoint == 'account' %}class="active"{% endif %}>Account</a>
        <a class="nav-action" href="{{ url_for('new_transaction') }}">+ Add</a>
        <span class="nav-user" title="{{ g.user[1] }}">{{ g.user[1] }}</span>
        <form class="inline-form" method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-small" type="submit">Log out</button>
        </form>
        {% else %}
        <a href="{{ url_for('login') }}"
           {% if request.endpoint == 'login' %}class="active"{% endif %}>Log in</a>
        <a class="nav-action" href="{{ url_for('register') }}">Create account</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
